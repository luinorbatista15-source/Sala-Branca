<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartas da Precisão | Katherine Johnson</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { espaco:'#0b0e27', estrela:'#f9d71c', nasaAzul:'#0f4c81' }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .container-cartas { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; padding: 1rem; }
            .carta { height: 260px; position: relative; cursor: pointer; perspective: 1000px; }
            .carta-interno { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s ease; transform-style: preserve-3d; }
            .carta.virada .carta-interno { transform: rotateY(180deg); cursor:default; }
            .carta-frente, .carta-verso { position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; border-radius: 1rem; padding: 1rem; }
            
            /* LINK DIRETO TESTADO E FUNCIONAL */
            .carta-frente { 
                background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.7)), 
                            url('https://upload.wikimedia.org/wikipedia/commons/7/7c/Katherine_Johnson_at_NASA%2C_in_1966.jpg') center/cover no-repeat; 
                border: 3px solid #f9d71c; 
                display:flex; flex-direction:column; align-items:center; justify-content:flex-end; 
                color:white; font-weight:bold; font-size:1.1rem; padding-bottom:15px; text-shadow: 0 0 8px #000;
            }
            .carta-frente i { font-size: 2.2rem; color: #f9d71c; margin-bottom: 10px; }

            .carta-verso { 
                background: #f8fafc; color:#0f172a; transform: rotateY(180deg); border: 3px solid #0f4c81; 
                display:flex; flex-direction:column; justify-content:center; overflow-y:auto;
            }
            .btn-verificar { background:#0f4c81; color:white; padding:7px 14px; border-radius:6px; margin-top:10px; font-weight:bold; border:none; cursor:pointer; transition:0.2s; }
            .btn-verificar:hover { background:#1e40af; }
            .correto { color:green; font-weight:bold; margin-top:8px; font-size:1.05rem; }
            .errado { color:red; font-weight:bold; margin-top:8px; font-size:1.05rem; }
            input { max-width: 85%; padding:8px; border:2px solid #93c5fd; border-radius:6px; font-size:1rem; text-align:center; margin-top:5px; }
        }
    </style>
</head>
<body class="bg-espaco text-white min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <header class="text-center mb-10">
            <h1 class="text-[clamp(1.8rem,5vw,3rem)] font-bold text-estrela mb-3">
                <i class="fa fa-star mr-3"></i>Desafios com Katherine Johnson
            </h1>
            <p class="text-lg text-blue-200">Clique na carta para ver o desafio → digite e confira sua resposta!</p>
            <button onclick="reiniciarTodas()" class="mt-4 bg-estrela text-espaco px-6 py-2 rounded-lg font-bold hover:bg-yellow-400 transition">
                🔄 Reiniciar e Embaralhar
            </button>
        </header>

        <div id="gradeCartas" class="container-cartas"></div>
    </div>

    <script>
        const listaDesafios = [
            {titulo:"Velocidade Orbital", pergunta:"Uma nave percorre 48 km em 6 segundos. Qual sua velocidade média em km/s?", resposta:8},
            {titulo:"Órbitas da Terra", pergunta:"Cada volta ao redor da Terra dura 90 minutos. Quantas órbitas completas em 5 horas?", resposta:3},
            {titulo:"Distância até a Lua", pergunta:"A distância média até a Lua é 384.000 km. Qual é a metade dessa distância em km?", resposta:192000},
            {titulo:"Sincronia de Antenas (MMC)", pergunta:"Uma antena envia sinal a cada 4 minutos, outra a cada 6 minutos. Qual o menor tempo em que enviam juntas (min)?", resposta:12},
            {titulo:"Cálculo de Combustível", pergunta:"Gasta 12 toneladas de combustível por minuto. Quantas toneladas em 7 minutos de subida?", resposta:84},
            {titulo:"Viagem Espacial", pergunta:"Viajando a 11 km/s, quantos km percorre em 9 segundos?", resposta:99},
            {titulo:"Divisão de Dados", pergunta:"720 medições para dividir igualmente entre 8 equipes. Quantos dados cada uma recebe?", resposta:90},
            {titulo:"Aniversário de 100 Anos", pergunta:"Katherine nasceu em 1918. Quantos anos completou no ano de 2018?", resposta:100},
            {titulo:"Total de Missões", pergunta:"Calculou 15 missões pequenas e 27 grandes. Quantas missões ao todo?", resposta:42},
            {titulo:"Redução de Erros", pergunta:"De 12 erros por relatório caiu para 3. Quantos erros foram eliminados?", resposta:9},
            {titulo:"Redução de Velocidade", pergunta:"De 11 km/s deve baixar para 7 km/s. Quantos km/s precisa reduzir?", resposta:4},
            {titulo:"Horas de Trabalho", pergunta:"Trabalhou 6 horas por dia durante 5 dias. Quantas horas no total?", resposta:30},
            {titulo:"Velocidade por Minuto", pergunta:"Percorre 720 km por minuto. Quantos km percorre em 5 minutos?", resposta:3600},
            {titulo:"Etapas da Viagem", pergunta:"Uma viagem de 4.500 km dividida em 5 partes iguais. Quantos km tem cada parte?", resposta:900},
            {titulo:"Anos de Reconhecimento", pergunta:"Começou na NASA em 1953 e ganhou a medalha em 2015. Quantos anos depois?", resposta:62},
            {titulo:"Ângulo de Lançamento", pergunta:"O ângulo ideal é 60°, usou 52°. Quantos graus faltaram para o ideal?", resposta:8}
        ];

        const grade = document.getElementById('gradeCartas');

        function embaralhar(lista) { return [...lista].sort(() => Math.random() - 0.5); }

        function criarCartas() {
            grade.innerHTML = '';
            const listaEmbaralhada = embaralhar(listaDesafios);

            listaEmbaralhada.forEach((desafio, i) => {
                const carta = document.createElement('div');
                carta.className = 'carta';
                carta.resolvida = false;

                carta.innerHTML = `
                    <div class="carta-interno">
                        <div class="carta-frente">
                            <i class="fa fa-rocket"></i>
                            Katherine Johnson
                        </div>
                        <div class="carta-verso">
                            <strong>${desafio.titulo}</strong><br><br>
                            <span>${desafio.pergunta}</span>
                            <input type="number" placeholder="Sua resposta..." id="resp-${i}">
                            <button class="btn-verificar" onclick="verificar(this, ${desafio.resposta}, this.closest('.carta'))">Verificar ✅</button>
                            <div class="mensagem"></div>
                        </div>
                    </div>
                `;

                carta.addEventListener('click', (e) => {
                    if (!carta.classList.contains('virada') && !carta.resolvida && !e.target.closest('input, button')) {
                        carta.classList.add('virada');
                    }
                });

                grade.appendChild(carta);
            });
        }

        function verificar(botao, respostaCorreta, elementoCarta) {
            const input = botao.previousElementSibling;
            const mensagem = botao.nextElementSibling;
            const valor = parseInt(input.value.trim());

            if (isNaN(valor)) {
                mensagem.textContent = "⚠️ Digite um número válido!";
                mensagem.className = "text-orange-500 font-bold mt-2";
                return;
            }

            if (valor === respostaCorreta) {
                mensagem.textContent = `✅ Correto! Valor: ${respostaCorreta}`;
                mensagem.className = 'correto';
                botao.disabled = true;
                input.disabled = true;
                botao.style.opacity = '0.6';
                elementoCarta.resolvida = true;
            } else {
                mensagem.textContent = `❌ Errou! Tente novamente`;
                mensagem.className = 'errado';
            }
        }

        function reiniciarTodas() {
            criarCartas();
        }

        window.onload = criarCartas;
    </script>
</body>
</html>
